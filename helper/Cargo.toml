[package]
name = "tc-probe"
version = "0.1.0"
edition = "2021"
description = "One-shot usage probes for the Token Cafe Noctalia plugin"

[[bin]]
name = "tc-probe"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-webpki-roots"] }
base64 = "0.22"
libc = "0.2"

[profile.release]
strip = true
